services:
  mongodb:
    image: mongo:8
    command:
      - mongod
      - "--wiredTigerCacheSizeGB"
      - "${MONGO_CACHE_GB:-0.5}"
      - "--maxConns"
      - "${MONGO_MAX_CONN:-25}"
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongo-data:
    # Pinned so the data volume keeps its identity across project renames.
    name: warehouse-mongo-data
