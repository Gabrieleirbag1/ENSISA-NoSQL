<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catalogue produits</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Catalogue produits</h1>
    <button id="btn-add" class="btn btn-primary" type="button">Ajouter un produit</button>
  </header>

  <nav class="navbar" aria-label="Navigation">
    <a href="/" class="active" aria-current="page">Produits</a>
    <a href="/categories">Catégories</a>
    <a href="/brands">Marques</a>
  </nav>

  <main>
    <div id="error-banner" class="banner" role="alert" hidden>
      <span id="error-banner-text"></span>
      <button id="btn-banner-close" class="banner-close" type="button" aria-label="Fermer">&times;</button>
    </div>

    <section id="form-panel" hidden>
      <h2 id="form-title">Ajouter un produit</h2>
      <form id="product-form" novalidate>
        <div class="grid">
          <label>
            Nom
            <input name="name" type="text" required />
          </label>
          <label>
            Description
            <input name="description" type="text" />
          </label>
          <label>
            Catégorie
            <input name="category" type="text" list="category-suggestions" />
            <datalist id="category-suggestions"></datalist>
          </label>
          <label>
            Marque
            <input name="brand" type="text" list="brand-suggestions" />
            <datalist id="brand-suggestions"></datalist>
          </label>
          <label>
            Prix
            <input name="price" type="number" step="0.01" min="0.01" required />
          </label>
          <label>
            Stock
            <input name="stock" type="number" step="1" min="0" required />
          </label>
          <label>
            Note (0 à 5)
            <input name="rating" type="number" step="0.1" min="0" max="5" required />
          </label>
          <label>
            Unités vendues
            <input name="units_sold" type="number" step="1" min="0" required />
          </label>
        </div>
        <p id="form-error" class="form-error" hidden></p>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Enregistrer</button>
          <button id="btn-cancel" class="btn" type="button">Annuler</button>
        </div>
      </form>
    </section>

    <section id="table-panel">
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Marque</th>
            <th>Catégorie</th>
            <th>Prix</th>
            <th>Stock</th>
            <th>Note</th>
            <th>Unités vendues</th>
            <th>Créé le</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="products-body"></tbody>
      </table>
      <p id="empty-message" class="muted" hidden>Aucun produit.</p>
    </section>

    <nav class="pagination" aria-label="Pagination">
      <button id="btn-prev" class="btn" type="button">Précédent</button>
      <span id="page-info" class="page-info">Page 1 sur 1 — 0 produits</span>
      <button id="btn-next" class="btn" type="button">Suivant</button>
    </nav>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
